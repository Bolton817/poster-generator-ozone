<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Disco Grid / Dancefloor Pattern -->
    <pattern id="discoFloorGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 20 L 20 20 M 20 0 L 20 20" fill="none" stroke="#a855f7" stroke-opacity="0.08" stroke-width="1" />
    </pattern>

    <!-- Neon Glow Filter -->
    <filter id="neonGlowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Neon Magenta/Purple Gradient for Title -->
    <linearGradient id="neonDiscoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Central Disco Spotlight Cone -->
    <linearGradient id="discoSpotlightCone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#090514" stop-opacity="0" />
    </linearGradient>

    <!-- Golden Highlight for Koroga Chicken Offer -->
    <linearGradient id="goldChickenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Deep Midnight Ultraviolet Background -->
  <rect width="400" height="500" fill="#090514" />

  <!-- Grid Perspective Floor / Ambience -->
  <rect width="400" height="500" fill="url(#discoFloorGrid)" />

  <!-- Radial Glow Behind Disco Ball -->
  <circle cx="200" cy="55" r="90" fill="#a855f7" fill-opacity="0.18" />
  <circle cx="200" cy="55" r="45" fill="#e879f9" fill-opacity="0.25" />

  <!-- Central Disco Spotlight Cone -->
  <polygon points="180,55 220,55 350,500 50,500" fill="url(#discoSpotlightCone)" />

  <!-- Mirrored Neon Laser Beams -->
  <line x1="200" y1="55" x2="30" y2="280" stroke="#c084fc" stroke-opacity="0.25" stroke-width="1.5" />
  <line x1="200" y1="55" x2="370" y2="280" stroke="#c084fc" stroke-opacity="0.25" stroke-width="1.5" />
  <line x1="200" y1="55" x2="0" y2="390" stroke="#e879f9" stroke-opacity="0.2" stroke-width="1.2" />
  <line x1="200" y1="55" x2="400" y2="390" stroke="#e879f9" stroke-opacity="0.2" stroke-width="1.2" />

  <!-- Neon Frame Border Accent -->
  <rect x="18" y="18" width="364" height="464" rx="8" fill="none" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5" />
  <rect x="22" y="22" width="356" height="456" rx="6" fill="none" stroke="#e879f9" stroke-opacity="0.15" stroke-width="0.8" />

  <!-- Disco Ball Motif -->
  <g transform="translate(200, 52)">
    <!-- Hanging cord -->
    <line x1="0" y1="-34" x2="0" y2="-12" stroke="#a855f7" stroke-opacity="0.6" stroke-width="1.5" />
    <!-- Ball circle -->
    <circle cx="0" cy="0" r="14" fill="#1e1035" stroke="#e879f9" stroke-width="1.5" />
    <!-- Facet lines -->
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#c084fc" stroke-opacity="0.6" stroke-width="0.8" />
    <line x1="-10" y1="-7" x2="10" y2="-7" stroke="#c084fc" stroke-opacity="0.5" stroke-width="0.8" />
    <line x1="-10" y1="7" x2="10" y2="7" stroke="#c084fc" stroke-opacity="0.5" stroke-width="0.8" />
    <line x1="0" y1="-14" x2="0" y2="14" stroke="#c084fc" stroke-opacity="0.6" stroke-width="0.8" />
    <line x1="-7" y1="-10" x2="-7" y2="10" stroke="#c084fc" stroke-opacity="0.5" stroke-width="0.8" />
    <line x1="7" y1="-10" x2="7" y2="10" stroke="#c084fc" stroke-opacity="0.5" stroke-width="0.8" />
    <!-- Glint star -->
    <path d="M 0 -3 L 1 0 L 4 0 L 2 2 L 3 5 L 0 3 L -3 5 L -2 2 L -4 0 L -1 0 Z" fill="#ffffff" />
  </g>

  <!-- Header Branding -->
  <g transform="translate(32, 40)">
    <text x="0" y="0" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="10" letter-spacing="1.5">OZONE LOUNGE</text>
    <text x="0" y="10" fill="#c084fc" font-family="sans-serif" font-weight="700" font-size="7" letter-spacing="1">WEDNESDAY DISCO</text>
  </g>

  <g transform="translate(368, 40)">
    <rect x="-65" y="-10" width="65" height="18" rx="4" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-opacity="0.6" stroke-width="1" />
    <text x="-32.5" y="2.5" fill="#e879f9" font-family="sans-serif" font-weight="800" font-size="7.5" letter-spacing="1" text-anchor="middle">LANNISTER</text>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(200, 95)">
    <rect x="-70" y="-9" width="140" height="18" rx="9" fill="#a855f7" fill-opacity="0.2" stroke="#e879f9" stroke-opacity="0.5" stroke-width="1" />
    <text x="0" y="3" fill="#fdf4ff" font-family="sans-serif" font-weight="800" font-size="7.5" letter-spacing="2" text-anchor="middle">MIDWEEK DISCO PARTY</text>
  </g>

  <!-- Main Headline: GROOVY WEDNESDAY -->
  <text x="200" y="142" fill="url(#neonDiscoGrad)" font-family="Impact, sans-serif" font-size="34" letter-spacing="2" text-anchor="middle" filter="url(#neonGlowPurple)">GROOVY</text>
  <text x="200" y="174" fill="#ffffff" font-family="Impact, sans-serif" font-size="30" letter-spacing="3" text-anchor="middle">WEDNESDAY</text>

  <!-- Disco Sound Subtitle & Equalizer graphic -->
  <g transform="translate(200, 192)">
    <!-- Mini Equalizer bars left -->
    <rect x="-115" y="-3" width="2" height="6" fill="#e879f9" />
    <rect x="-110" y="-6" width="2" height="12" fill="#c084fc" />
    <rect x="-105" y="-9" width="2" height="18" fill="#a855f7" />
    <rect x="-100" y="-4" width="2" height="8" fill="#e879f9" />
    
    <text x="0" y="2" fill="#c084fc" font-family="sans-serif" font-weight="700" font-size="8" letter-spacing="3" text-anchor="middle">DISCO • CLASSICS • RETRO BEATS</text>

    <!-- Mini Equalizer bars right -->
    <rect x="98" y="-4" width="2" height="8" fill="#e879f9" />
    <rect x="103" y="-9" width="2" height="18" fill="#a855f7" />
    <rect x="108" y="-6" width="2" height="12" fill="#c084fc" />
    <rect x="113" y="-3" width="2" height="6" fill="#e879f9" />
  </g>

  <!-- =========================================================
       DUAL-OFFER SHOWCASE (CRITICAL BLUEPRINT REQUIREMENT)
       Card 1: Primary Free Koroga Chicken Card
       Card 2: Secondary Whiskey/Cognac/Beer Discounts Banner
       ========================================================= -->

  <!-- Primary Offer Card (VIP Highlight Badge) -->
  <g transform="translate(40, 215)">
    <!-- Outer Glow Frame -->
    <rect width="320" height="74" rx="10" fill="#150a2b" stroke="#eab308" stroke-width="1.8" />
    
    <!-- Left Food / VIP Accent Tag -->
    <path d="M 0 10 Q 0 0 10 0 L 38 0 L 38 74 L 10 74 Q 0 74 0 64 Z" fill="url(#goldChickenGrad)" />
    <!-- Chicken / Flame Icon Placeholder -->
    <text x="19" y="42" fill="#090514" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle">★</text>

    <!-- Primary Offer Headline -->
    <text x="50" y="22" fill="#eab308" font-family="sans-serif" font-weight="900" font-size="8" letter-spacing="1.5">PRIMARY COMPLIMENTARY SPECIAL</text>
    <text x="50" y="42" fill="#ffffff" font-family="Impact, sans-serif" font-size="17" letter-spacing="1">FREE KOROGA CHICKEN</text>
    <text x="50" y="60" fill="#fef08a" font-family="sans-serif" font-weight="700" font-size="9.5">ON THE HOUSE FOR ALL REVELLERS</text>

    <!-- Star accent right -->
    <circle cx="295" cy="37" r="14" fill="#eab308" fill-opacity="0.15" stroke="#eab308" stroke-opacity="0.6" stroke-width="1" />
    <text x="295" y="41" fill="#eab308" font-family="sans-serif" font-weight="900" font-size="9" text-anchor="middle">FREE</text>
  </g>

  <!-- Secondary Offer Card (Drink Specials Strip) -->
  <g transform="translate(40, 300)">
    <rect width="320" height="46" rx="8" fill="#110722" stroke="#a855f7" stroke-opacity="0.7" stroke-width="1.2" />
    
    <!-- Mini bottle / beverage icon -->
    <rect x="12" y="11" width="24" height="24" rx="4" fill="#a855f7" fill-opacity="0.25" stroke="#c084fc" stroke-opacity="0.5" stroke-width="1" />
    <text x="24" y="27" fill="#e879f9" font-family="sans-serif" font-weight="900" font-size="11" text-anchor="middle">🍸</text>

    <!-- Secondary Offer Text -->
    <text x="46" y="22" fill="#e879f9" font-family="sans-serif" font-weight="800" font-size="7.5" letter-spacing="1">BEVERAGE PRIVILEGES</text>
    <text x="46" y="36" fill="#fdf4ff" font-family="sans-serif" font-weight="700" font-size="9">DISCOUNTS ON WHISKEY, COGNAC &amp; BEER BUCKETS</text>
  </g>

  <!-- =========================================================
       HIGH-CONTRAST DJ PANEL (DJ DONBEN & DJ VIN)
       ========================================================= -->
  <g transform="translate(40, 360)">
    <rect width="320" height="66" rx="10" fill="#1b0e36" stroke="#c084fc" stroke-opacity="0.6" stroke-width="1.5" />
    
    <!-- Header DJ Tag -->
    <rect x="12" y="10" width="76" height="15" rx="3" fill="#a855f7" fill-opacity="0.3" stroke="#a855f7" stroke-opacity="0.6" stroke-width="0.8" />
    <text x="50" y="21" fill="#fdf4ff" font-family="sans-serif" font-weight="800" font-size="7" letter-spacing="1" text-anchor="middle">RESIDENT DJS</text>

    <!-- DJ Names -->
    <text x="12" y="47" fill="#ffffff" font-family="Impact, sans-serif" font-size="20" letter-spacing="1">DJ DONBEN</text>
    <text x="145" y="47" fill="#e879f9" font-family="Impact, sans-serif" font-size="16">&amp;</text>
    <text x="165" y="47" fill="#ffffff" font-family="Impact, sans-serif" font-size="20" letter-spacing="1">DJ VIN</text>

    <!-- Equalizer Animation Accents -->
    <g transform="translate(285, 30)">
      <rect x="0" y="4" width="3" height="16" fill="#a855f7" />
      <rect x="6" y="-2" width="3" height="22" fill="#c084fc" />
      <rect x="12" y="8" width="3" height="12" fill="#e879f9" />
      <rect x="18" y="2" width="3" height="18" fill="#ffffff" />
    </g>
  </g>

  <!-- Footer Operational Details -->
  <g transform="translate(200, 448)">
    <text x="0" y="0" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="9" letter-spacing="2" text-anchor="middle">OZONE LOUNGE NAIROBI</text>
    <text x="0" y="12" fill="#94a3b8" font-family="sans-serif" font-weight="600" font-size="7" letter-spacing="1.5" text-anchor="middle">FREE ENTRY • DOORS OPEN 5:00 PM • @OZONELOUNGE</text>
  </g>
</svg>
