<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Metallic Chrome Silver Gradient -->
    <linearGradient id="lothbrokChromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="60%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Diagonal Speed Cut Beam -->
    <linearGradient id="lothbrokSpeedBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="45%" stop-color="#94a3b8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </linearGradient>

    <!-- Metallic Reflection Filter -->
    <filter id="chromeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Onyx Night Base -->
  <rect width="400" height="500" fill="#020617" />

  <!-- Diagonal Aerodynamic Slice Geometry -->
  <polygon points="0,0 260,0 120,500 0,500" fill="url(#lothbrokSpeedBeam)" />
  <polygon points="260,0 264,0 124,500 120,500" fill="#f8fafc" fill-opacity="0.3" />

  <!-- Supersonic Flight Speed Streaks -->
  <line x1="30" y1="110" x2="370" y2="110" stroke="#94a3b8" stroke-opacity="0.25" stroke-width="1" />
  <line x1="120" y1="114" x2="370" y2="114" stroke="#f8fafc" stroke-opacity="0.4" stroke-width="0.8" />
  <line x1="200" y1="118" x2="370" y2="118" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.2" />

  <!-- Lower Speed Streaks -->
  <line x1="30" y1="440" x2="220" y2="440" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
  <line x1="30" y1="444" x2="280" y2="444" stroke="#f8fafc" stroke-opacity="0.3" stroke-width="0.8" />
  <line x1="30" y1="448" x2="370" y2="448" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1" />

  <!-- Aerodynamic Corner Chevrons -->
  <g transform="translate(360, 50)" opacity="0.6">
    <path d="M 0 0 L 10 10 L 0 20" fill="none" stroke="#f8fafc" stroke-width="1.5" />
    <path d="M 8 0 L 18 10 L 8 20" fill="none" stroke="#94a3b8" stroke-width="1.5" />
  </g>

  <!-- Metallic Frame Border -->
  <rect x="18" y="18" width="364" height="464" rx="6" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1.5" />
  <rect x="22" y="22" width="356" height="456" rx="4" fill="none" stroke="#f8fafc" stroke-opacity="0.1" stroke-width="0.8" />

  <!-- Top Header Branding -->
  <g transform="translate(32, 42)">
    <text x="0" y="0" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="10" letter-spacing="1.5">OZONE LOUNGE</text>
    <text x="0" y="10" fill="#94a3b8" font-family="sans-serif" font-weight="700" font-size="7" letter-spacing="1.5">FRIDAY FLIGHT</text>
  </g>

  <g transform="translate(368, 42)">
    <rect x="-65" y="-10" width="65" height="18" rx="3" fill="#f8fafc" fill-opacity="0.15" stroke="#f8fafc" stroke-opacity="0.5" stroke-width="1" />
    <text x="-32.5" y="2.5" fill="#f8fafc" font-family="sans-serif" font-weight="800" font-size="7.5" letter-spacing="1" text-anchor="middle">LOTHBROK</text>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(200, 85)">
    <rect x="-70" y="-9" width="140" height="18" rx="3" fill="#f8fafc" fill-opacity="0.12" stroke="#94a3b8" stroke-opacity="0.5" stroke-width="1" />
    <text x="0" y="3" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="7.5" letter-spacing="2" text-anchor="middle">PREMIUM FRIDAY NIGHTLIFE</text>
  </g>

  <!-- Flight Wing Accent Icon -->
  <g transform="translate(200, 130)">
    <polygon points="0,0 28,-10 18,6 0,2 -18,6 -28,-10" fill="url(#lothbrokChromeGrad)" />
    <circle cx="0" cy="0" r="3" fill="#38bdf8" />
  </g>

  <!-- Event Headline: FLIGHT FRIDAYS -->
  <text x="200" y="180" fill="url(#lothbrokChromeGrad)" font-family="Impact, sans-serif" font-size="40" letter-spacing="3" text-anchor="middle" filter="url(#chromeGlow)">FLIGHT</text>
  <text x="200" y="216" fill="#ffffff" font-family="Impact, sans-serif" font-size="34" letter-spacing="3" text-anchor="middle">FRIDAYS</text>

  <!-- Aerodynamic Subtitle -->
  <text x="200" y="238" fill="#94a3b8" font-family="sans-serif" font-weight="700" font-size="8" letter-spacing="3" text-anchor="middle">HIGH-ALTITUDE SOUNDS • THE WEEKEND TAKEOFF</text>

  <!-- =========================================================
       DECISION 06: OFFER-FREE BALANCED COMPOSITION
       Allocates central visual weight to the prominent headliner
       DJ block (DJ Slim D & Mistabrand). Zero dummy offer box!
       ========================================================= -->
  <g transform="translate(36, 265)">
    <!-- Main Metallic Performer Box -->
    <rect width="328" height="150" rx="10" fill="#090d16" stroke="#94a3b8" stroke-opacity="0.5" stroke-width="1.5" />
    
    <!-- Top Chrome Stripe Tag -->
    <path d="M 0 10 Q 0 0 10 0 L 318 0 Q 328 0 328 10 L 328 26 L 0 26 Z" fill="url(#lothbrokChromeGrad)" />
    <text x="164" y="17" fill="#020617" font-family="sans-serif" font-weight="900" font-size="8.5" letter-spacing="2" text-anchor="middle">HEADLINE FLIGHT RESIDENTS</text>

    <!-- DJ Slim D -->
    <g transform="translate(24, 60)">
      <text x="0" y="0" fill="#94a3b8" font-family="sans-serif" font-weight="800" font-size="8" letter-spacing="1.5">RESIDENT SELECTOR</text>
      <text x="0" y="24" fill="#ffffff" font-family="Impact, sans-serif" font-size="26" letter-spacing="1">DJ SLIM D</text>
    </g>

    <!-- Metallic Sound Separator -->
    <g transform="translate(164, 76)">
      <circle cx="0" cy="0" r="14" fill="#020617" stroke="#f8fafc" stroke-width="1.2" />
      <text x="0" y="4" fill="#38bdf8" font-family="Impact, sans-serif" font-size="14" text-anchor="middle">&amp;</text>
    </g>

    <!-- Mistabrand -->
    <g transform="translate(200, 60)">
      <text x="0" y="0" fill="#94a3b8" font-family="sans-serif" font-weight="800" font-size="8" letter-spacing="1.5">SPECIAL GUEST</text>
      <text x="0" y="24" fill="#ffffff" font-family="Impact, sans-serif" font-size="26" letter-spacing="1">MISTABRAND</text>
    </g>

    <!-- Bottom Audio EQ Bars -->
    <g transform="translate(30, 118)">
      <rect x="0" y="8" width="4" height="14" fill="#94a3b8" />
      <rect x="8" y="2" width="4" height="20" fill="#f8fafc" />
      <rect x="16" y="6" width="4" height="16" fill="#38bdf8" />
      <rect x="24" y="0" width="4" height="22" fill="#ffffff" />
      <rect x="32" y="10" width="4" height="12" fill="#94a3b8" />
      <text x="50" y="16" fill="#94a3b8" font-family="sans-serif" font-weight="700" font-size="8" letter-spacing="1.5">STRICTLY PREMIUM URBAN, AFROBEATS &amp; AMAPIANO</text>
    </g>
  </g>

  <!-- Footer Operational Details -->
  <g transform="translate(200, 468)">
    <text x="0" y="0" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="9" letter-spacing="2" text-anchor="middle">OZONE LOUNGE NAIROBI</text>
    <text x="0" y="12" fill="#94a3b8" font-family="sans-serif" font-weight="600" font-size="7" letter-spacing="1.5" text-anchor="middle">DOORS OPEN 6:00 PM • DRESS CODE: SMART CASUAL • @OZONELOUNGE</text>
  </g>
</svg>
