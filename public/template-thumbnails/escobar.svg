<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Radiant Fiesta Citrus Gradient -->
    <linearGradient id="fiestaCitrusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Warm Amber Glow Gradient -->
    <radialGradient id="amberOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#180a04" stop-opacity="0" />
    </radialGradient>

    <!-- Crimson Fiesta Orb -->
    <radialGradient id="crimsonOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#ef4444" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#180a04" stop-opacity="0" />
    </radialGradient>

    <!-- Emerald Fiesta Accent Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Whiskey Amber Card Gradient -->
    <linearGradient id="whiskeyCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1305" />
      <stop offset="100%" stop-color="#190902" />
    </linearGradient>

    <!-- Subtle Fiesta Glow Filter -->
    <filter id="festiveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Warm Fiesta Dark Base -->
  <rect width="400" height="500" fill="#180a04" />

  <!-- Layered Ambient Light Orbs -->
  <circle cx="80" cy="140" r="130" fill="url(#amberOrb)" />
  <circle cx="330" cy="240" r="140" fill="url(#crimsonOrb)" />
  <circle cx="200" cy="420" r="150" fill="url(#amberOrb)" />

  <!-- Layered Geometric Color Blocks & Panels -->
  <!-- Block 1: Upper Right Angled Fiesta Amber Tier -->
  <polygon points="180,0 400,0 400,120 220,120" fill="#f59e0b" fill-opacity="0.12" />
  <line x1="180" y1="120" x2="400" y2="120" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Block 2: Vibrant Diagonal Accent Ribbon -->
  <polygon points="0,70 140,70 90,140 0,140" fill="#ef4444" fill-opacity="0.15" />
  <polygon points="120,68 126,68 76,142 70,142" fill="#ef4444" fill-opacity="0.4" />

  <!-- Block 3: Central Hero Framing Blocks -->
  <rect x="28" y="95" width="344" height="185" rx="8" fill="#240e06" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="1.5" />
  <rect x="36" y="103" width="328" height="169" rx="6" fill="#140602" fill-opacity="0.85" />

  <!-- Central Party Graphic / Fiesta Burst Motif -->
  <g transform="translate(200, 185)" opacity="0.25">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,4" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="#ef4444" stroke-width="1.5" />
    <polygon points="0,-35 10,-10 35,0 10,10 0,35 -10,10 -35,0 -10,-10" fill="#f59e0b" />
  </g>

  <!-- Confetti / Festive Sparkles -->
  <g opacity="0.6">
    <circle cx="45" cy="85" r="2.5" fill="#f59e0b" />
    <circle cx="360" cy="75" r="2" fill="#10b981" />
    <polygon points="70,295 73,300 68,300" fill="#ef4444" />
    <polygon points="345,155 348,160 343,160" fill="#f59e0b" />
    <circle cx="320" cy="305" r="2" fill="#10b981" />
    <circle cx="55" cy="370" r="2" fill="#ef4444" />
    <polygon points="360,420 363,425 358,425" fill="#f59e0b" />
  </g>

  <!-- Top Header Branding -->
  <g transform="translate(32, 44)">
    <text x="0" y="0" fill="#fffbeb" font-family="sans-serif" font-weight="900" font-size="11" letter-spacing="2">OZONE LOUNGE</text>
    <text x="0" y="12" fill="#f59e0b" font-family="sans-serif" font-weight="700" font-size="7.5" letter-spacing="1.5">SATURDAY WEEKEND CELEBRATION</text>
  </g>

  <!-- Saturday Day Pill -->
  <g transform="translate(290, 32)">
    <rect width="78" height="22" rx="11" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" />
    <text x="39" y="15" fill="#fffbeb" font-family="sans-serif" font-weight="800" font-size="9" letter-spacing="1" text-anchor="middle">SATURDAY</text>
  </g>

  <!-- Title Section: SATURDAY FIESTA -->
  <g transform="translate(200, 160)">
    <!-- Celebratory Drop Shadow / Underlay -->
    <text x="2" y="2" fill="#000000" font-family="sans-serif" font-weight="900" font-size="34" letter-spacing="3" text-anchor="middle">SATURDAY</text>
    <text x="0" y="0" fill="#fffbeb" font-family="sans-serif" font-weight="900" font-size="34" letter-spacing="3" text-anchor="middle">SATURDAY</text>
    
    <text x="2" y="38" fill="#781404" font-family="sans-serif" font-weight="900" font-size="40" letter-spacing="4" text-anchor="middle">FIESTA</text>
    <text x="0" y="36" fill="url(#fiestaCitrusGrad)" font-family="sans-serif" font-weight="900" font-size="40" letter-spacing="4" text-anchor="middle" filter="url(#festiveGlow)">FIESTA</text>

    <!-- Sub-bar -->
    <rect x="-80" y="48" width="160" height="3" rx="1.5" fill="url(#fiestaCitrusGrad)" />
  </g>

  <!-- DJ Billing Block: DVJ JOJEZ -->
  <g transform="translate(32, 298)">
    <!-- Background Card -->
    <rect width="336" height="54" rx="8" fill="#220b04" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1" />
    
    <!-- DVJ Tag Badge -->
    <rect x="14" y="16" width="38" height="22" rx="4" fill="url(#fiestaCitrusGrad)" />
    <text x="33" y="31" fill="#180a04" font-family="sans-serif" font-weight="900" font-size="9.5" letter-spacing="0.5" text-anchor="middle">DVJ</text>

    <!-- Performer Name -->
    <text x="62" y="28" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="17" letter-spacing="1">JOJEZ</text>
    <text x="62" y="42" fill="#f59e0b" font-family="sans-serif" font-weight="700" font-size="8" letter-spacing="1.5">RESIDENT VIDEO DJ • LIVE VISUAL MIX</text>

    <!-- Audio/Visual Bars Indicator -->
    <g transform="translate(290, 22)">
      <rect x="0" y="12" width="3" height="8" fill="#10b981" rx="1.5" />
      <rect x="5" y="4" width="3" height="16" fill="#f59e0b" rx="1.5" />
      <rect x="10" y="8" width="3" height="12" fill="#ef4444" rx="1.5" />
      <rect x="15" y="0" width="3" height="20" fill="#f59e0b" rx="1.5" />
      <rect x="20" y="6" width="3" height="14" fill="#10b981" rx="1.5" />
    </g>
  </g>

  <!-- Beverage Special / Offer Box: WHISKEY & COGNAC SPECIAL -->
  <g transform="translate(32, 364)">
    <rect width="336" height="66" rx="8" fill="url(#whiskeyCardGrad)" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.2" />
    
    <!-- Left Accent Stripe -->
    <rect x="0" y="0" width="5" height="66" rx="2" fill="url(#fiestaCitrusGrad)" />

    <!-- Offer Pill / Header -->
    <rect x="16" y="12" width="118" height="16" rx="3" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" stroke-opacity="0.5" stroke-width="0.8" />
    <text x="22" y="23.5" fill="#fca5a5" font-family="sans-serif" font-weight="800" font-size="7" letter-spacing="1">WEEKEND DRINKS SPECIAL</text>

    <!-- Offer Copy -->
    <text x="16" y="42" fill="#fffbeb" font-family="sans-serif" font-weight="800" font-size="11.5" letter-spacing="0.5">DISCOUNTS ON WHISKEY &amp; COGNAC</text>
    <text x="16" y="55" fill="#f59e0b" font-family="sans-serif" font-weight="600" font-size="8.5">Special bottle pricing all night long • Celebrate in style</text>

    <!-- Bottle / Glass Icon Graphic -->
    <g transform="translate(302, 22)" stroke="#f59e0b" stroke-width="1.2" fill="none">
      <path d="M 6 0 L 10 0 L 10 6 L 14 10 L 14 24 L 2 24 L 2 10 L 6 6 Z" />
      <line x1="4" y1="16" x2="12" y2="16" stroke="#ef4444" stroke-width="1" />
    </g>
  </g>

  <!-- Footer Logistics Bar -->
  <g transform="translate(32, 452)">
    <line x1="0" y1="0" x2="336" y2="0" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1" />
    <text x="0" y="18" fill="#fffbeb" font-family="sans-serif" font-weight="700" font-size="8" letter-spacing="1">OZONE LOUNGE</text>
    <text x="0" y="28" fill="#9ca3af" font-family="sans-serif" font-weight="500" font-size="7">DOORS OPEN 6:00 PM • STRICTLY 21+</text>
    <text x="336" y="22" fill="#f59e0b" font-family="sans-serif" font-weight="700" font-size="8" letter-spacing="0.5" text-anchor="end">@OZONELOUNGE</text>
  </g>
</svg>
