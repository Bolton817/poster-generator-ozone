<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="sunsetGlow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#d97706" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#120a02" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sunDisc" cx="50%" cy="32%" r="35%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#ea580c" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#18181b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="500" fill="#140d05" />

  <!-- Sun Disc / Radial Halo -->
  <circle cx="200" cy="150" r="160" fill="url(#sunsetGlow)" />
  <circle cx="200" cy="150" r="100" fill="url(#sunDisc)" />
  
  <!-- Subtle Vinyl Grooves -->
  <circle cx="200" cy="150" r="130" fill="none" stroke="#f59e0b" stroke-opacity="0.1" stroke-width="1" />
  <circle cx="200" cy="150" r="115" fill="none" stroke="#f59e0b" stroke-opacity="0.12" stroke-width="1" />
  <circle cx="200" cy="150" r="85" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="1" />

  <!-- Header -->
  <g transform="translate(30, 40)">
    <rect width="28" height="28" rx="6" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-opacity="0.4" />
    <text x="14" y="19" fill="#f59e0b" font-family="sans-serif" font-weight="900" font-size="12" text-anchor="middle">OZ</text>
    
    <text x="36" y="14" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="12" letter-spacing="1">OZONE LOUNGE</text>
    <text x="36" y="24" fill="#a1a1aa" font-family="sans-serif" font-weight="600" font-size="8" letter-spacing="1.5">MONDAY SUNDOWNERS</text>

    <text x="340" y="18" fill="#f59e0b" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="end" letter-spacing="1">REDDINGTON</text>
  </g>

  <!-- Session Tag -->
  <g transform="translate(200, 105)">
    <rect x="-70" y="-10" width="140" height="20" rx="10" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.3" />
    <text x="0" y="3" fill="#fbbf24" font-family="sans-serif" font-weight="700" font-size="8.5" letter-spacing="1.5" text-anchor="middle">OLD CLASSICS &amp; SUNDOWNERS</text>
  </g>

  <!-- Big Retro Title -->
  <text x="200" y="160" fill="url(#titleGrad)" font-family="Impact, sans-serif" font-size="34" letter-spacing="1" text-anchor="middle">OLD CLASSICS</text>
  <text x="200" y="195" fill="url(#titleGrad)" font-family="Impact, sans-serif" font-size="34" letter-spacing="1" text-anchor="middle">&amp; SUNDOWNERS</text>

  <!-- DJ Panel -->
  <g transform="translate(200, 240)">
    <line x1="-120" y1="0" x2="-60" y2="0" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1" />
    <text x="0" y="-8" fill="#a1a1aa" font-family="sans-serif" font-weight="700" font-size="7" letter-spacing="2" text-anchor="middle">SPECIAL GUEST &amp; SELECTOR</text>
    <text x="0" y="12" fill="#fafaf9" font-family="Impact, sans-serif" font-size="20" letter-spacing="1" text-anchor="middle">MONSIEUR PIERRE</text>
    <line x1="60" y1="0" x2="120" y2="0" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1" />
  </g>

  <!-- Offer Ticket / Ribbon -->
  <g transform="translate(45, 290)">
    <rect width="310" height="70" rx="12" fill="#18181b" fill-opacity="0.85" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1" />
    
    <text x="20" y="24" fill="#fbbf24" font-family="sans-serif" font-weight="700" font-size="8.5" letter-spacing="1.5">HAPPY HOUR OFFER</text>
    <text x="20" y="46" fill="#f4f4f5" font-family="sans-serif" font-weight="700" font-size="14">Discounts on all drinks</text>

    <!-- Wine Exclusion Pill -->
    <rect x="200" y="22" width="94" height="26" rx="6" fill="#f97316" fill-opacity="0.25" stroke="#f97316" stroke-opacity="0.5" />
    <text x="247" y="38" fill="#fdba74" font-family="sans-serif" font-weight="800" font-size="8.5" text-anchor="middle" letter-spacing="1">EXCLUDING WINE</text>
  </g>

  <!-- Footer -->
  <g transform="translate(30, 440)">
    <line x1="0" y1="0" x2="340" y2="0" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1" />
    <text x="0" y="22" fill="#a1a1aa" font-family="sans-serif" font-size="8">Every Monday from 4:00 PM</text>
    <text x="170" y="22" fill="#a1a1aa" font-family="sans-serif" font-size="8" text-anchor="middle">Ozone Lounge · @ozonelounge</text>
    <text x="340" y="22" fill="#f59e0b" font-family="sans-serif" font-weight="700" font-size="8" text-anchor="end">1080 × 1350</text>
  </g>
</svg>
