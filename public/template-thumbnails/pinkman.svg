<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Warm Amber / Sepia Gradient -->
    <linearGradient id="amberVintageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Vinyl Record Center Label Gradient -->
    <radialGradient id="vinylCenterLabel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="90%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#1c1407" />
    </radialGradient>

    <!-- Ambient Vinyl Warm Glow -->
    <radialGradient id="vinylWarmAura" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1c1407" stop-opacity="0" />
    </radialGradient>

    <!-- Beer Bucket Card Gradient -->
    <linearGradient id="beerCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1a08" />
      <stop offset="100%" stop-color="#160e05" />
    </linearGradient>

    <!-- Subtle Vintage Glow Filter -->
    <filter id="vintageGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Warm Chestnut / Sepia Base -->
  <rect width="400" height="500" fill="#1c1407" />

  <!-- Ambient Warm Aura -->
  <circle cx="200" cy="180" r="180" fill="url(#vinylWarmAura)" />

  <!-- Concentric Vinyl Record Grooves (Upper Turntable Motif) -->
  <g transform="translate(200, 175)" opacity="0.45">
    <!-- Vinyl Disc Outer Body -->
    <circle cx="0" cy="0" r="130" fill="#0d0904" stroke="#d97706" stroke-opacity="0.4" stroke-width="1.5" />
    
    <!-- Micro-groove Concentric Rings -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="0.8" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#d97706" stroke-opacity="0.25" stroke-width="1" />
    <circle cx="0" cy="0" r="100" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="0.8" />
    <circle cx="0" cy="0" r="90" fill="none" stroke="#d97706" stroke-opacity="0.2" stroke-width="1.2" />
    <circle cx="0" cy="0" r="80" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="0.8" />
    <circle cx="0" cy="0" r="70" fill="none" stroke="#d97706" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="0" cy="0" r="60" fill="none" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="0.8" />

    <!-- Vinyl Reflection Light Beams (Turntable Shine) -->
    <polygon points="0,0 -40,-130 40,-130" fill="#fef3c7" fill-opacity="0.04" />
    <polygon points="0,0 -40,130 40,130" fill="#fef3c7" fill-opacity="0.04" />

    <!-- Vinyl Center Label (A-Side) -->
    <circle cx="0" cy="0" r="46" fill="url(#vinylCenterLabel)" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="#1c1407" stroke-width="0.8" />
    
    <!-- 45 RPM Adapter Spindle Notch -->
    <circle cx="0" cy="0" r="12" fill="#1c1407" stroke="#f59e0b" stroke-width="1" />
    <circle cx="0" cy="0" r="4" fill="#000000" />
    <line x1="-12" y1="0" x2="-4" y2="0" stroke="#f59e0b" stroke-width="1" />
    <line x1="4" y1="0" x2="12" y2="0" stroke="#f59e0b" stroke-width="1" />
    <line x1="0" y1="-12" x2="0" y2="-4" stroke="#f59e0b" stroke-width="1" />
    <line x1="0" y1="4" x2="0" y2="12" stroke="#f59e0b" stroke-width="1" />
  </g>

  <!-- Turntable Tonearm Accent (Right Edge) -->
  <g transform="translate(350, 85)" opacity="0.35">
    <circle cx="0" cy="0" r="8" fill="#d97706" />
    <line x1="0" y1="0" x2="-60" y2="70" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round" />
    <rect x="-72" y="65" width="16" height="8" rx="2" fill="#d97706" transform="rotate(-30 -64 69)" />
  </g>

  <!-- Retro Frame Borders -->
  <rect x="18" y="18" width="364" height="464" rx="8" fill="none" stroke="#d97706" stroke-opacity="0.3" stroke-width="1.5" />
  <rect x="22" y="22" width="356" height="456" rx="6" fill="none" stroke="#f59e0b" stroke-opacity="0.12" stroke-width="0.8" />

  <!-- Top Header Branding -->
  <g transform="translate(32, 44)">
    <text x="0" y="0" fill="#fef3c7" font-family="sans-serif" font-weight="900" font-size="11" letter-spacing="2">OZONE LOUNGE</text>
    <text x="0" y="12" fill="#d97706" font-family="sans-serif" font-weight="700" font-size="7.5" letter-spacing="1.5">RETRO VINYL &amp; THROWBACK SESSIONS</text>
  </g>

  <!-- Sunday Day Badge -->
  <g transform="translate(294, 32)">
    <rect width="74" height="22" rx="11" fill="#d97706" fill-opacity="0.25" stroke="#f59e0b" stroke-width="1" />
    <text x="37" y="15" fill="#fef3c7" font-family="sans-serif" font-weight="800" font-size="9" letter-spacing="1" text-anchor="middle">SUNDAY</text>
  </g>

  <!-- Title Section: OLD SKOOL SUNDAYS -->
  <g transform="translate(200, 195)">
    <!-- Retro Vintage Drop Shadow -->
    <text x="2" y="-12" fill="#000000" font-family="sans-serif" font-weight="900" font-size="32" letter-spacing="2" text-anchor="middle">OLD SKOOL</text>
    <text x="0" y="-14" fill="#fef3c7" font-family="sans-serif" font-weight="900" font-size="32" letter-spacing="2" text-anchor="middle">OLD SKOOL</text>

    <text x="2" y="24" fill="#582404" font-family="sans-serif" font-weight="900" font-size="38" letter-spacing="3" text-anchor="middle">SUNDAYS</text>
    <text x="0" y="22" fill="url(#amberVintageGrad)" font-family="sans-serif" font-weight="900" font-size="38" letter-spacing="3" text-anchor="middle" filter="url(#vintageGlow)">SUNDAYS</text>

    <!-- Retro Double Divider -->
    <line x1="-90" y1="36" x2="90" y2="36" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="-60" y1="40" x2="60" y2="40" stroke="#d97706" stroke-width="1" stroke-opacity="0.4" />
  </g>

  <!-- DJ Billing Block: DJ NGASH -->
  <g transform="translate(32, 298)">
    <rect width="336" height="54" rx="8" fill="#251708" stroke="#d97706" stroke-opacity="0.35" stroke-width="1" />
    
    <!-- Vinyl Badge Icon -->
    <g transform="translate(26, 27)">
      <circle cx="0" cy="0" r="14" fill="#1c1407" stroke="#f59e0b" stroke-width="1.2" />
      <circle cx="0" cy="0" r="6" fill="#d97706" />
      <circle cx="0" cy="0" r="2" fill="#000000" />
    </g>

    <!-- Performer Information -->
    <text x="54" y="27" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="16" letter-spacing="1">DJ NGASH</text>
    <text x="54" y="41" fill="#f59e0b" font-family="sans-serif" font-weight="700" font-size="8" letter-spacing="1.5">OLD SKOOL SPECIALIST • ALL VINYL CLASSICS</text>

    <!-- 33 / 45 RPM Speed Indicator -->
    <g transform="translate(290, 20)">
      <rect width="36" height="16" rx="3" fill="#1c1407" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="0.8" />
      <text x="18" y="11.5" fill="#f59e0b" font-family="sans-serif" font-weight="800" font-size="7.5" text-anchor="middle">45 RPM</text>
    </g>
  </g>

  <!-- Beer Bucket Promotional Offer Box -->
  <g transform="translate(32, 364)">
    <rect width="336" height="66" rx="8" fill="url(#beerCardGrad)" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1.2" />
    
    <!-- Left Vintage Accent Stripe -->
    <rect x="0" y="0" width="5" height="66" rx="2" fill="url(#amberVintageGrad)" />

    <!-- Offer Pill Header -->
    <rect x="16" y="12" width="108" height="16" rx="3" fill="#d97706" fill-opacity="0.25" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="0.8" />
    <text x="22" y="23.5" fill="#fed7aa" font-family="sans-serif" font-weight="800" font-size="7" letter-spacing="1">SUNDAY DRINKS SPECIAL</text>

    <!-- Offer Copy -->
    <text x="16" y="42" fill="#fef3c7" font-family="sans-serif" font-weight="800" font-size="12" letter-spacing="0.5">DISCOUNTS ON BEER BUCKETS</text>
    <text x="16" y="55" fill="#f59e0b" font-family="sans-serif" font-weight="600" font-size="8.5">Ice cold bucket specials all day • Perfect for Sunday chilling</text>

    <!-- Beer Bucket / Bottles SVG Graphic -->
    <g transform="translate(300, 20)" stroke="#f59e0b" stroke-width="1.2" fill="none">
      <!-- Bucket Outline -->
      <polygon points="4,10 24,10 21,26 7,26" fill="#1c1407" />
      <!-- Bucket Handle -->
      <path d="M 2 10 C 2 3 26 3 26 10" />
      <!-- Bottle Necks in Ice -->
      <line x1="9" y1="4" x2="9" y2="10" stroke-width="1.8" />
      <line x1="14" y1="2" x2="14" y2="10" stroke-width="1.8" />
      <line x1="19" y1="5" x2="19" y2="10" stroke-width="1.8" />
    </g>
  </g>

  <!-- Footer Logistics Bar -->
  <g transform="translate(32, 452)">
    <line x1="0" y1="0" x2="336" y2="0" stroke="#d97706" stroke-opacity="0.2" stroke-width="1" />
    <text x="0" y="18" fill="#fef3c7" font-family="sans-serif" font-weight="700" font-size="8" letter-spacing="1">OZONE LOUNGE</text>
    <text x="0" y="28" fill="#a8a29e" font-family="sans-serif" font-weight="500" font-size="7">GATES OPEN 4:00 PM • RELAXED SUNDAY VIBES</text>
    <text x="336" y="22" fill="#f59e0b" font-family="sans-serif" font-weight="700" font-size="8" letter-spacing="0.5" text-anchor="end">@OZONELOUNGE</text>
  </g>
</svg>
